server {
    listen 80;
    server_name whirl.uz www.whirl.uz;
    root /var/www/whirl;
    index index.html;

    location / {
        try_files $uri $uri/ /whirl.html;
    }

    location /gzs/ {
        proxy_pass http://10.0.1.25/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /smartparking/swagger/ {
        proxy_pass http://10.0.1.206:5121/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    location /smartparking/ {
        proxy_pass http://10.0.1.206/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /scan/ {
        proxy_pass http://10.0.1.25/;
        proxy_set_header Host $host;
    }

    location /api/ {
        if ($http_referer ~* /asseto/) {
            rewrite ^ /__asseto_api$uri last;
        }
        proxy_pass http://10.0.1.25:5036;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /__asseto_api/ {
        internal;
        rewrite ^/__asseto_api(.*)$ $1 break;
        proxy_pass http://10.0.1.131:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /asseto;
    }

    location /swagger/ {
        proxy_pass http://10.0.1.25:5036;
        proxy_set_header Host $host;
    }

    location /Billing/ {
        proxy_pass http://10.0.1.206:5121/;
        proxy_set_header Host $host;
    }

    location /payment/ {
        proxy_pass http://10.0.1.206:5121/;
        proxy_set_header Host $host;
    }

    location /billing-schr/ {
        proxy_pass http://10.0.1.88:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;
        sub_filter '"/api/' '"/billing-schr/api/';
        sub_filter "'/api/" "'/billing-schr/api/";
    }

    location /asseto/ {
        proxy_pass http://10.0.1.131:8000/;
        proxy_redirect / /asseto/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /asseto;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '"/static/' '"/asseto/static/';
        sub_filter '"/api/' '"/asseto/api/';
        sub_filter '"/login' '"/asseto/login';
        sub_filter '"/dashboard' '"/asseto/dashboard';
        sub_filter '"/inventory' '"/asseto/inventory';
        sub_filter '"/equipment' '"/asseto/equipment';
        sub_filter '"/profile' '"/asseto/profile';
        sub_filter '"/admin' '"/asseto/admin/';
        sub_filter '"/history' '"/asseto/history';
        sub_filter '"/documents' '"/asseto/documents';
        sub_filter '"/orgchart' '"/asseto/orgchart';
        sub_filter '"/tasks' '"/asseto/tasks';
        sub_filter '"/office' '"/asseto/office';
        sub_filter '"/maintenance' '"/asseto/maintenance';
        sub_filter '"/requests' '"/asseto/requests';
        sub_filter '"/analytics' '"/asseto/analytics';
        sub_filter '"/rooms' '"/asseto/rooms';
        sub_filter '"/sw.js' '"/asseto/sw.js';
        sub_filter '"/settings' '"/asseto/settings';
        sub_filter '"/users' '"/asseto/users';
        sub_filter '"/security' '"/asseto/security';
        sub_filter '"/dismissals' '"/asseto/dismissals';
        sub_filter "location='/'" "location='/asseto/'";
        sub_filter "'/static/" "'/asseto/static/";
        sub_filter "'/api/" "'/asseto/api/";
        sub_filter "'/login" "'/asseto/login";
        sub_filter "'/dashboard" "'/asseto/dashboard";
        sub_filter "'/inventory" "'/asseto/inventory";
        sub_filter "'/equipment" "'/asseto/equipment";
        sub_filter "'/profile" "'/asseto/profile";
        sub_filter "'/admin" "'/asseto/admin/";
        sub_filter "'/history" "'/asseto/history";
        sub_filter "'/documents" "'/asseto/documents";
        sub_filter "'/orgchart" "'/asseto/orgchart";
        sub_filter "'/tasks" "'/asseto/tasks";
        sub_filter "'/office" "'/asseto/office";
        sub_filter "'/maintenance" "'/asseto/maintenance";
        sub_filter "'/requests" "'/asseto/requests";
        sub_filter "'/analytics" "'/asseto/analytics";
        sub_filter "'/rooms" "'/asseto/rooms";
        sub_filter "'/sw.js" "'/asseto/sw.js";
        sub_filter "'/settings" "'/asseto/settings";
        sub_filter "'/users" "'/asseto/users";
        sub_filter "'/security" "'/asseto/security";
        sub_filter "'/dismissals" "'/asseto/dismissals";
        sub_filter "'/'" "'/asseto/'";
    }

    location ~* \.pdf$ {
        add_header Content-Disposition "inline";
    }
}
