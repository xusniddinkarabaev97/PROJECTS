name: BillingSCHR Deploy

on:
  push:
    branches: [main, master]
    paths:
      - "Billing SCHR/**"
      - ".github/workflows/billingschr-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to BillingSCHR server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BILLINGSCHR_SSH_HOST }}
          username: ${{ secrets.BILLINGSCHR_SSH_USER }}
          key: ${{ secrets.BILLINGSCHR_SSH_KEY }}
          port: ${{ secrets.BILLINGSCHR_SSH_PORT || 22 }}
          script: |
            set -e
            echo "=== Deploying BillingSCHR to 10.0.1.88 ==="
            ssh -o StrictHostKeyChecking=no 10.0.1.88 '
              cd /opt/billingschr
              git pull origin main
              docker compose -f docker-compose.billingschr.yml up -d --build
              docker image prune -af --filter "until=24h" || true
              echo "=== Deploy done ==="
              docker compose -f docker-compose.billingschr.yml ps
            '

      - name: Health check
        run: |
          sleep 10
          for i in 1 2 3; do
            echo "Attempt $i..."
            curl -fsSk "https://${{ secrets.BILLINGSCHR_SSH_HOST }}/billing-schr/api/Companies/login" \
              -X POST -H "Content-Type: application/json" \
              -d '{"login":"admin","password":"admin123"}' && exit 0
            sleep 5
          done
          echo "Health check failed"
          exit 1
